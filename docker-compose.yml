services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dropcart
      POSTGRES_PASSWORD: dropcart
      POSTGRES_DB: dropcart
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropcart"]
      interval: 3s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://dropcart:dropcart@postgres:5432/dropcart
      REDIS_URL: redis://redis:6379/0
      WEBHOOK_SECRET: change-me
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy